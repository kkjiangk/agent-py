[project]
name = "super-ai-backend"
version = "0.1.0"
description = "Backend foundation for the Super AI monorepo."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "confluent-kafka>=2.12.0",
    "fastapi>=0.116.0",
    "greenlet>=3.5.3",
    "httpx>=0.28.1",
    "langchain>=1.3.12",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.8",
    "mcp>=1.28.1",
    "opentelemetry-api>=1.36.0",
    "opentelemetry-exporter-otlp-proto-http>=1.36.0",
    "opentelemetry-sdk>=1.36.0",
    "pwdlib[argon2]>=0.3.0",
    "pymilvus>=3.0.0,<4.0.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.51",
    "tencentcloud-cls-sdk-python==1.0.4",
    "uvicorn>=0.35.0",
]

[tool.uv]
override-dependencies = ["protobuf>=5.27.2"]

[dependency-groups]
dev = [
  "pyright>=1.1.400",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/super_ai"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "integration_tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
